name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile for TypeScript 6 migration
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/typescript-6-toolchain'
        run: |
          npm install --package-lock-only
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate package-lock for TypeScript 6"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare test data directory
        run: mkdir -p data

      - name: Test
        run: npm test -- --runInBand
